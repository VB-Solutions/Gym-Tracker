server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos de Vite llevan un hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo (/login, /home...) la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, así cada deploy llega enseguida
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
